# Configuração do nginx para o Gerador de Escopo Sankhya
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Acentuação correta em HTML, CSS e JavaScript
    charset utf-8;
    charset_types text/html text/css application/javascript text/plain;

    location / {
        try_files $uri $uri/ =404;
        # Sempre busca a versão mais recente dos arquivos (útil ao atualizar o data.js)
        add_header Cache-Control "no-cache";
    }
}
