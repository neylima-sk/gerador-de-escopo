# Gerador de Escopo Sankhya — servidor local com Docker
#   Subir:  docker compose up -d      → abrir http://localhost:8080
#   Parar:  docker compose down
services:
  gerador-sankhya:
    image: nginx:1.27-alpine
    container_name: gerador-sankhya
    ports:
      # Só neste computador. Para liberar na rede, troque por "8080:80" (atenção: a ferramenta tem dados internos).
      - "127.0.0.1:8080:80"
    volumes:
      # Arquivos montados somente leitura: alterações nos arquivos aparecem ao atualizar a página.
      # A pasta "simulacoes" não entra no container: as versões são gravadas pelo navegador direto no seu disco.
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
